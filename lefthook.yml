# Agents grep past banners and summaries; a failed job still prints its whole output
output:
  - failure
  - execution_out

# Check-only; a hook that re-stages files sweeps in a concurrent session's edits
pre-commit:
  jobs:
    - name: format
      run: pnpm exec prettier --check --ignore-unknown {staged_files}

pre-push:
  jobs:
    - name: gate
      run: pnpm check

check:
  piped: true
  jobs:
    - name: types
      run: tsc --noEmit
    - name: verify
      group:
        parallel: true
        jobs:
          - name: format
            run: prettier --check . --cache --log-level warn
          - name: lint
            run: eslint --max-warnings 0 --cache --cache-location node_modules/.cache/eslint/
          - name: unused
            run: knip
          - name: dupes
            run: fallow dupes --quiet
          # Health prints its report even at zero findings, so output shows only on failure
          - name: complexity
            run: out=$(fallow health --complexity --quiet 2>&1) || { printf '%s\n' "$out"; exit 1; }
          - name: architecture
            run: fallow architecture --quiet
          # `fallow architecture` skips stale and reasonless suppressions; only dead-code reports them
          - name: suppressions
            run: fallow dead-code --stale-suppressions --quiet
          - name: test
            run: vitest run --passWithNoTests

fix:
  piped: true
  jobs:
    - name: autofix
      group:
        piped: true
        jobs:
          - name: format
            run: prettier --write . --cache --list-different
          - name: lint
            run: eslint --fix --cache --cache-location node_modules/.cache/eslint/
    - name: report
      run: pnpm check
